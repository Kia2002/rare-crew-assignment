<p class="note">Highlighted rows worked less than {{ lowHoursThreshold }} hours.</p>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th class="hours">Total time worked</th>
    </tr>
  </thead>
  <tbody>
    @for (employee of employees(); track employee.name) {
      <tr [class.low-hours]="employee.hasLowHours">
        <td>{{ employee.name }}</td>
        <td class="hours">{{ employee.totalHours | number: '1.1-1' }} h</td>
      </tr>
    }
  </tbody>
</table>
