<main>
  <h1>Time worked per employee</h1>

  @if (timeEntries.isLoading()) {
    <p>Loading time entries...</p>
  } @else if (timeEntries.error()) {
    <p>Could not load time entries. Please try again later.</p>
  } @else {
    <div class="content">
      <app-employee-table [employees]="employees()" />
      <app-employee-chart [employees]="employees()" />
    </div>
  }
</main>
